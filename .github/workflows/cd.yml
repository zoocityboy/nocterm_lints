name: CD - Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional explicit release version (e.g. 0.3.0)'
        required: false
      dry_run:
        description: 'When true, skip publishing steps'
        required: false
        default: 'false'

jobs:
  verify-release:
    name: Verify release preconditions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Run quick checks
        run: |
          dart analyze
          dart test --reporter expanded
      - name: Check CHANGELOG contains release entry (best-effort)
        run: |
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            grep -q "${{ github.event.inputs.release_version }}" CHANGELOG.md || true
          fi

  release-test-matrix:
    name: Full test matrix
    needs: verify-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Run tests (full)
        run: dart test

